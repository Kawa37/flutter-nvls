name: Build Flutter APK

on:
    push:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Code auschecken
              uses: actions/checkout@v4

            - name: Java einrichten
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Flutter einrichten
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - name: Dependencies laden
              run: flutter pub get

            - name: Decode Keystore
              run: |
                  mkdir -p android/app
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks

            - name: Create key.properties
              run: |
                  echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/app/key.properties
                  echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/key.properties
                  echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/key.properties
                  echo "storeFile=key.jks" >> android/app/key.properties

            - name: APK bauen (Split per ABI)
              run: flutter build apk --release --split-per-abi

            - name: Als Release veröffentlichen
              uses: ncipollo/release-action@v1
              with:
                  artifacts: "build/app/outputs/apk/release/*"
                  tag: "v0.5.0"
                  name: "App v0.5.0"
                  allowUpdates: true
                  overwrite: true
                  token: ${{ secrets.TOKEN }}
